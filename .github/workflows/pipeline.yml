name: pipeline
on:
  # Every branch and every tag: the mirror needs to see all of them, and the
  # jobs below carry their own ref guards.
  push:
  # Staggered per repository. The Wayback Machine is rate-limited and one save
  # takes ~110s, so a shared cron would have every repo throttling the rest.
  schedule:
    - cron: "12 4 17 * *"
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v3
        with:
          go-version: 1.19

      - name: Check out code
        uses: actions/checkout@v3

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=30m0s
          skip-cache: true

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.19

      - name: Run tests
        run: make test-coverage

      - name: Upload Coverage report to CodeCov
        uses: codecov/codecov-action@v3
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: ./coverage.txt

  release:
    if: contains(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every branch and every tag, which is why it carries no ref filter: a mirror
  # that only saw the default branch would silently drop the rest.
  mirror:
    if: github.event_name == 'push'
    uses: psyb0t/reusable-github-workflows/.github/workflows/git-mirror.yml@master
    with:
      gitlab_enabled: true
      # Gitee is off: it requires a mobile number bound to the account before
      # any repository can be public, and rather than refusing it creates the
      # repo private, so the mirror runs green while nobody can see it. Turn it
      # back on once the account is verified.
      gitee_enabled: false
    secrets:
      gitlab_token: ${{ secrets.GITLAB_TOKEN }}

  # Runs on the monthly cron, on a manual dispatch, and on a push to the default
  # branch or a tag -- but NOT on every feature-branch push, or a rate-limited
  # archive would be hammered for no benefit.
  archive:
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/archive.yml@master
    with:
      # Off because no archive.org keys are set on this repo. Outlink capture
      # only works on the authenticated Save Page Now API; on the keyless path
      # the flag is silently ignored, so leaving it on would just log a warning
      # every run. Add wayback_access_key / wayback_secret_key and flip this to
      # true to sweep in every page the README links to.
      capture_outlinks: false
